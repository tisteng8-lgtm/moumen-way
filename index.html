<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طريق مؤمن - Moumen Way</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(180deg, #1a1a3e, #2a1a4e);
            padding: 10px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(100, 50, 255, 0.3);
            border: 2px solid #6a4a9a;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 420px;
            height: auto;
            aspect-ratio: 360 / 640;
            background: linear-gradient(180deg, #1a2a6a, #2a1a4a);
            border-radius: 20px;
            margin: 0 auto;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            touch-action: none;
            cursor: pointer;
        }
        .ui-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px 4px;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(100, 50, 255, 0.5);
        }
        .ui-bar span {
            background: rgba(255,255,255,0.1);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .hint {
            color: rgba(255,255,255,0.6);
            font-size: 0.65rem;
            padding: 6px 10px 0;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .hint i {
            font-style: normal;
            background: rgba(255,255,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
            margin: 0 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="ui-bar">
        <span>🏃 <span id="scoreDisplay">0</span></span>
        <span>💰 <span id="coinDisplay">0</span></span>
        <span>⚡ <span id="speedDisplay">1</span>x</span>
    </div>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <div class="hint">
        <i>⬆️ نطة</i> <i>⬇️ زحف</i> <i>⬅️ ➡️ حارات</i>
    </div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const coinSpan = document.getElementById('coinDisplay');
        const speedSpan = document.getElementById('speedDisplay');

        const W = 360, H = 640;
        const LANE_WIDTH = 80;
        const LEFT_MARGIN = 40;

        let player = {
            lane: 1,
            y: 500,
            width: 32,
            height: 48,
            isJumping: false,
            isDucking: false,
            jumpSpeed: 0,
            groundY: 500,
            duckHeight: 28,
            normalHeight: 48,
        };

        let gameOver = false;
        let score = 0;
        let coins = 0;
        let speed = 2;
        let frame = 0;
        let obstacles = [];
        let coinItems = [];
        let powerups = [];
        let particles = [];
        let buildings = [];

        // Powerups
        let magnetActive = false;
        let magnetTimer = 0;
        let jumpBoostActive = false;
        let jumpBoostTimer = 0;
        let hoverboardActive = false;
        let hoverboardTimer = 0;
        let scoreMultiplier = 1;
        let multiplierTimer = 0;

        let touchStartX = 0, touchStartY = 0;

        // Generate buildings for background
        for (let i = 0; i < 12; i++) {
            buildings.push({
                x: i * 35,
                width: 20 + Math.random() * 25,
                height: 30 + Math.random() * 80,
                color: `hsl(${220 + Math.random() * 30}, 30%, ${20 + Math.random() * 20}%)`
            });
        }

        function getLaneX(lane) {
            return LEFT_MARGIN + lane * LANE_WIDTH + (LANE_WIDTH - player.width) / 2;
        }

        function resetGame() {
            gameOver = false;
            score = 0;
            coins = 0;
            speed = 2;
            frame = 0;
            obstacles = [];
            coinItems = [];
            powerups = [];
            particles = [];
            magnetActive = false;
            jumpBoostActive = false;
            hoverboardActive = false;
            scoreMultiplier = 1;
            player.lane = 1;
            player.y = player.groundY;
            player.isJumping = false;
            player.isDucking = false;
            player.height = player.normalHeight;
            updateUI();
        }

        function updateUI() {
            scoreSpan.textContent = Math.floor(score);
            coinSpan.textContent = coins;
            speedSpan.textContent = (speed * 0.7 + 0.8).toFixed(1);
        }

        function spawnObstacle() {
            let lane = Math.floor(Math.random() * 3);
            let type = Math.floor(Math.random() * 4);
            let w = 40, h = 45;
            let label = '';
            let color = '#4a5f7a';
            
            if (type === 0) { w = 55; h = 50; label = '🚂'; color = '#3a4a6a'; }
            else if (type === 1) { w = 42; h = 28; label = '🪵'; color = '#8b6b4d'; }
            else if (type === 2) { w = 48; h = 22; label = '🚧'; color = '#b87333'; }
            else { w = 28; h = 55; label = '⛔'; color = '#5d4e3b'; }
            
            obstacles.push({
                lane: lane,
                x: W + 20,
                y: player.groundY - h + 8,
                width: w,
                height: h,
                type: type,
                label: label,
                color: color,
                passed: false
            });
        }

        function spawnCoin() {
            let lane = Math.floor(Math.random() * 3);
            coinItems.push({
                lane: lane,
                x: W + 30,
                y: player.groundY - 40 - Math.random() * 50,
                width: 20,
                height: 20,
                collected: false
            });
        }

        function spawnPowerup() {
            let lane = Math.floor(Math.random() * 3);
            let types = ['magnet', 'jumpboost', 'hoverboard', 'multiplier'];
            let ptype = types[Math.floor(Math.random() * types.length)];
            let emoji = '🧲';
            if (ptype === 'jumpboost') emoji = '👟';
            else if (ptype === 'hoverboard') emoji = '🛹';
            else if (ptype === 'multiplier') emoji = '✖️';
            
            powerups.push({
                lane: lane,
                x: W + 30,
                y: player.groundY - 50,
                width: 26,
                height: 26,
                type: ptype,
                emoji: emoji
            });
        }

        function addParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * 2 * Math.PI;
                let spd = 1 + Math.random() * 4;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd - 1,
                    life: 30 + Math.random() * 20,
                    size: 2 + Math.random() * 5,
                    color: color || '#ffd966'
                });
            }
        }

        function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
            return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function update() {
            if (gameOver) return;

            frame++;
            speed = 2 + Math.floor(score / 120) * 0.3;
            if (speed > 7) speed = 7;

            // Powerup timers
            if (magnetActive) { magnetTimer--; if (magnetTimer <= 0) magnetActive = false; }
            if (jumpBoostActive) { jumpBoostTimer--; if (jumpBoostTimer <= 0) jumpBoostActive = false; }
            if (hoverboardActive) { hoverboardTimer--; if (hoverboardTimer <= 0) hoverboardActive = false; }
            if (scoreMultiplier > 1) { multiplierTimer--; if (multiplierTimer <= 0) scoreMultiplier = 1; }

            // Jump physics
            if (player.isJumping) {
                player.jumpSpeed += 0.6;
                player.y += player.jumpSpeed;
                if (player.y >= player.groundY) {
                    player.y = player.groundY;
                    player.isJumping = false;
                    player.jumpSpeed = 0;
                }
            }

            // Spawn obstacles
            let spawnRate = Math.max(18, 55 - Math.floor(score / 40));
            if (frame % spawnRate === 0 && Math.random() < 0.7) spawnObstacle();

            // Spawn coins
            if (frame % (20 + Math.floor(Math.random() * 20)) === 0 && Math.random() < 0.5) spawnCoin();

            // Spawn powerups
            if (frame % (80 + Math.floor(Math.random() * 80)) === 0 && Math.random() < 0.25) spawnPowerup();

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed * 1.3;
                if (obs.x + obs.width < 0) { obstacles.splice(i, 1); continue; }

                let px = getLaneX(player.lane);
                let py = player.y - player.height;
                let pw = player.width;
                let ph = player.height;
                if (player.isDucking) {
                    ph = player.duckHeight;
                    py = player.groundY - ph;
                }

                if (player.lane === obs.lane && rectCollide(px, py, pw, ph, obs.x, obs.y, obs.width, obs.height)) {
                    if (hoverboardActive) {
                        hoverboardActive = false;
                        hoverboardTimer = 0;
                        addParticles(px + pw/2, py + ph/2, '#ffaa33', 25);
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        gameOver = true;
                        addParticles(px + pw/2, py + ph/2, '#ff3333', 35);
                        return;
                    }
                }

                if (!obs.passed && obs.x + obs.width < getLaneX(player.lane) + 10) {
                    obs.passed = true;
                    score += 1 * scoreMultiplier;
                }
            }

            // Move coins
            for (let i = coinItems.length - 1; i >= 0; i--) {
                let c = coinItems[i];
                c.x -= speed * 1.3;
                if (c.x + c.width < 0) { coinItems.splice(i, 1); continue; }

                let px = getLaneX(player.lane) + player.width/2;
                let py = player.y - player.height/2;
                let cx = c.x + c.width/2;
                let cy = c.y + c.height/2;

                if (magnetActive) {
                    let dist = Math.hypot(px - cx, py - cy);
                    if (dist < 120) {
                        let angle = Math.atan2(py - cy, px - cx);
                        c.x += Math.cos(angle) * 4;
                        c.y += Math.sin(angle) * 4;
                    }
                }

                if (Math.abs(px - cx) < 28 && Math.abs(py - cy) < 28) {
                    coins += 1 * Math.floor(scoreMultiplier);
                    addParticles(c.x + c.width/2, c.y + c.height/2, '#f7d44a', 12);
                    coinItems.splice(i, 1);
                    updateUI();
                }
            }

            // Move powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.x -= speed * 1.3;
                if (p.x + p.width < 0) { powerups.splice(i, 1); continue; }

                let px = getLaneX(player.lane) + player.width/2;
                let py = player.y - player.height/2;
                let cx = p.x + p.width/2;
                let cy = p.y + p.height/2;

                if (Math.abs(px - cx) < 30 && Math.abs(py - cy) < 30) {
                    if (p.type === 'magnet') { magnetActive = true; magnetTimer = 350; }
                    else if (p.type === 'jumpboost') { jumpBoostActive = true; jumpBoostTimer = 400; }
                    else if (p.type === 'hoverboard') { hoverboardActive = true; hoverboardTimer = 350; }
                    else if (p.type === 'multiplier') { scoreMultiplier = 3; multiplierTimer = 400; }
                    addParticles(p.x + p.width/2, p.y + p.height/2, '#76f2b0', 18);
                    powerups.splice(i, 1);
                }
            }

            score += 0.2 * speed;
            updateUI();

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Move buildings
            for (let b of buildings) {
                b.x -= speed * 0.3;
                if (b.x + b.width < 0) {
                    b.x = W + Math.random() * 50;
                    b.width = 20 + Math.random() * 25;
                    b.height = 30 + Math.random() * 80;
                    b.color = `hsl(${220 + Math.random() * 30}, 30%, ${20 + Math.random() * 20}%)`;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Sky gradient (neon style)
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a2a');
            grad.addColorStop(0.5, '#1a1a4a');
            grad.addColorStop(1, '#2a1a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Stars
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.arc((i * 37 + 13) % W, (i * 23 + 7) % (H * 0.5), 1 + Math.random(), 0, Math.PI * 2);
                ctx.fill();
            }

            // Buildings
            for (let b of buildings) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, H - 120 - b.height, b.width, b.height);
                // Windows
                ctx.fillStyle = 'rgba(255,255,100,0.3)';
                for (let wy = 0; wy < b.height - 10; wy += 12) {
                    for (let wx = 2; wx < b.width - 5; wx += 10) {
                        if (Math.random() > 0.3)
                            ctx.fillRect(b.x + wx, H - 120 - b.height + 5 + wy, 4, 6);
                    }
                }
            }

            // Ground (neon)
            ctx.fillStyle = '#1a1a3a';
            ctx.fillRect(0, player.groundY + 10, W, H - player.groundY);
            ctx.fillStyle = 'rgba(100, 50, 255, 0.1)';
            ctx.fillRect(0, player.groundY + 10, W, 2);

            // Rail tracks
            for (let i = 0; i < 3; i++) {
                let x = LEFT_MARGIN + i * LANE_WIDTH + LANE_WIDTH/2;
                ctx.strokeStyle = 'rgba(200, 180, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 10]);
                ctx.beginPath();
                ctx.moveTo(x, 50);
                ctx.lineTo(x, player.groundY - 5);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Horizontal track lines
            for (let y = 100; y < player.groundY; y += 30) {
                ctx.strokeStyle = 'rgba(200, 180, 255, 0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(LEFT_MARGIN - 10, y);
                ctx.lineTo(LEFT_MARGIN + LANE_WIDTH * 3 + 10, y);
                ctx.stroke();
            }

            // Powerups
            for (let p of powerups) {
                ctx.shadowColor = '#6a4a9a';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(26, 26, 74, 0.8)';
                ctx.beginPath();
                ctx.arc(p.x + p.width/2, p.y + p.height/2, 16, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.emoji, p.x + p.width/2, p.y + p.height/2);
            }

            // Coins
            for (let c of coinItems) {
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(c.x + c.width/2, c.y + c.height/2, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#b8860b';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💰', c.x + c.width/2, c.y + c.height/2);
            }

            // Obstacles
            for (let obs of obstacles) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.fillStyle = obs.color;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.fillText(obs.label, obs.x + obs.width/2, obs.y + obs.height/2);
            }

            // Player
            let px = getLaneX(player.lane);
            let py = player.y - player.height;
            if (player.isDucking) {
                py = player.groundY - player.duckHeight;
            }

            // Glow
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(100, 50, 255, 0.5)';

            // Body
            ctx.fillStyle = '#2a1a5a';
            ctx.beginPath();
            ctx.roundRect(px, py, player.width, player.height, 8);
            ctx.fill();

            // T-shirt
            ctx.fillStyle = '#f5c542';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('M', px + player.width/2, py + player.height/2);

            // Eyes
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px + 8, py + 10, 4, 0, Math.PI*2);
            ctx.arc(px + player.width - 8, py + 10, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#0a0a2a';
            ctx.beginPath();
            ctx.arc(px + 10, py + 11, 2, 0, Math.PI*2);
            ctx.arc(px + player.width - 6, py + 11, 2, 0, Math.PI*2);
            ctx.fill();

            // Hoverboard effect
            if (hoverboardActive) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffaa33';
                ctx.strokeStyle = '#ffaa33';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(px - 3, py + player.height - 3, player.width + 6, 6, 6);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Particles
            for (let p of particles) {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Speed lines
            for (let i = 0; i < 10; i++) {
                ctx.strokeStyle = `rgba(200, 180, 255, ${0.02 + Math.random() * 0.03})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * W, Math.random() * H);
                ctx.lineTo(Math.random() * W, Math.random() * H);
                ctx.stroke();
            }

            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff3333';
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 GAME OVER', W/2, H/2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '20px sans-serif';
                ctx.fillText('👆 اضغط للبدء', W/2, H/2 + 40);
            }

            // Powerup indicators
            let indicatorY = 40;
            if (magnetActive) { ctx.fillStyle = '#f7d44a'; ctx.font = '16px sans-serif'; ctx.fillText('🧲 مغناطيس', 15, indicatorY); indicatorY += 24; }
            if (jumpBoostActive) { ctx.fillStyle = '#b3e5fc'; ctx.fillText('👟 قفز عالي', 15, indicatorY); indicatorY += 24; }
            if (hoverboardActive) { ctx.fillStyle = '#ffaa33'; ctx.fillText('🛹 Hoverboard', 15, indicatorY); indicatorY += 24; }
            if (scoreMultiplier > 1) { ctx.fillStyle = '#ff6b6b'; ctx.fillText(`✖️${scoreMultiplier}`, 15, indicatorY); }
        }

        // Helper
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // Controls
        function handleSwipe(dx, dy) {
            if (gameOver) { resetGame(); return; }
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 15 && player.lane < 2) player.lane++;
                else if (dx < -15 && player.lane > 0) player.lane--;
            } else {
                if (dy < -25 && !player.isJumping) {
                    player.isJumping = true;
                    player.jumpSpeed = -7 - (jumpBoostActive ? 4 : 0);
                } else if (dy > 25) {
                    player.isDucking = true;
                    player.height = player.duckHeight;
                } else {
                    player.isDucking = false;
                    player.height = player.normalHeight;
                }
            }
        }

        // Touch
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameOver) return;
            const t = e.touches[0];
            let dx = t.clientX - touchStartX;
            let dy = t.clientY - touchStartY;
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                handleSwipe(dx, dy);
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            player.isDucking = false;
            player.height = player.normalHeight;
            if (gameOver) resetGame();
        }, { passive: false });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (gameOver) { resetGame(); return; }
            const key = e.key;
            if (key === 'ArrowLeft' && player.lane > 0) { player.lane--; e.preventDefault(); }
            else if (key === 'ArrowRight' && player.lane < 2) { player.lane++; e.preventDefault(); }
            else if (key === 'ArrowUp' && !player.isJumping) {
                player.isJumping = true;
                player.jumpSpeed = -7 - (jumpBoostActive ? 4 : 0);
                e.preventDefault();
            }
            else if (key === 'ArrowDown') {
                player.isDucking = true;
                player.height = player.duckHeight;
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown') {
                player.isDucking = false;
                player.height = player.normalHeight;
                e.preventDefault();
            }
        });

        canvas.addEventListener('click', () => { if (gameOver) resetGame(); });

        // Game loop
        resetGame();
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    })();
</script>
</body>
</html>
